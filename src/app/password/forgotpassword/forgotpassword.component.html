<div class="forgot-password-container">
  <h2>Forgot Password</h2>

  <!-- Step 1: Enter Email -->
  <form *ngIf="!otpSent" (ngSubmit)="sendOtp()">
    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>
    <button type="submit">Send OTP</button>
  </form>

  <!-- Step 2: Enter OTP -->
  <form *ngIf="otpSent && !otpVerified" (ngSubmit)="verifyOtp()">
    <div class="form-group">
      <label>Enter OTP:</label>
      <input type="text" [(ngModel)]="otp" name="otp" required />
    </div>
    <button type="submit">Verify OTP</button>
  </form>

  <!-- Step 3: Reset Password -->

  <form *ngIf="otpVerified" (ngSubmit)="resetPassword()" #resetForm="ngForm">
    <!-- New Password -->
    <div class="form-group">
      <label>New Password:</label>
      <input
        type="password"
        [(ngModel)]="newPassword"
        name="newPassword"
        required
        minlength="8"
        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[!@#$%^&*]).+$"
        #passwordInput="ngModel"
      />
      
      <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="error">
        <div *ngIf="passwordInput.errors?.['required']">Password is required.</div>
        <div *ngIf="passwordInput.errors?.['minlength']">Password must be at least 8 characters.</div>
        <div *ngIf="passwordInput.errors?.['pattern']">
          Password must contain uppercase, lowercase, number, and special character.
        </div>
      </div>
    </div>

    <!-- ✅ Confirm Password -->
    <div class="form-group">
      <label>Confirm Password:</label>
      <input
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
        #confirmPasswordInput="ngModel"
      />
      <div *ngIf="confirmPassword && confirmPassword !== newPassword" class="error">
        Passwords do not match.
      </div>
    </div>

    <!-- Subit -->
     <!-- Done -->
    <button
      type="submit"
      [disabled]="newPassword !== confirmPassword"
    >
      Reset Password
    </button>
  </form>

  <p *ngIf="message">{{ message }}</p>
</div>
