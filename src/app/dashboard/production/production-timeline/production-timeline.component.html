<section class="card timeline-section mb-6">
  <div class="page-header">
    <h2 class="title">Production Timeline</h2>
    <div class="header-actions">
      <button class="btn-primary" (click)="load()" [disabled]="isLoading">Refresh</button>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!isLoading && timelines.length > 0" class="timeline-card">
    <div class="timeline-grid">
      <!-- Desktop Header -->
      <div class="timeline-row timeline-header">
        <div>Schedule ID</div>
        <div>Product / Remarks</div>
        <div>Updated At</div>
        <div>Status</div>
        <div>Qty</div>
        <div>Action</div>
      </div>

      <!-- Timeline Rows -->
      <div class="timeline-row" *ngFor="let t of timelines">
        <div data-label="Schedule ID">#{{ t.psId }}</div>
        <div class="remarks" data-label="Product / Remarks">{{ t.productName }}</div>
        <div data-label="Updated At">{{ t.dto?.updatedAt | date:'dd MMM yyyy, HH:mm' }}</div>
        <div data-label="Status">
          <span class="status-badge" [ngClass]="{
            'status-inprogress': t.status === 'IN_PROGRESS',
            'status-complete': t.status === 'COMPLETED',
            'status-pending': t.status === 'PENDING'
          }">{{ t.status }}</span>
        </div>
        <div data-label="Qty">{{ t.dto?.quantity ?? '-' }}</div>
        <div data-label="Action">
          <button class="btn-secondary" (click)="viewDetails(t.psId)">View Details</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && timelines.length === 0" class="empty">
    No production timelines found.
  </div>
</section>
