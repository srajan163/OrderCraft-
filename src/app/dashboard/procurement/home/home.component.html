<!-- home page-->
<div class="home-container">
  <h1>Welcome to the Procurement Dashboard 👋</h1>
  <p>Select an option from the sidebar to get started.</p>

  <div class="cards">
    <div class="card total">
      <div class="card-header">
        <span class="icon">📦</span>
        <h2>Total Orders</h2>
      </div>
      <p class="metric">67</p>
      <div class="trend-bar">
        <div class="trend-fill" style="width: 80%;"></div>
      </div>
      <p class="trend-text">80% of target</p>
    </div>

    <div class="card pending">
      <div class="card-header">
        <span class="icon">⏳</span>
        <h2>Pending Orders</h2>
      </div>
      <p class="metric">5</p>
      <div class="trend-bar">
        <div class="trend-fill" style="width: 40%;"></div>
      </div>
      <p class="trend-text">15% pending</p>
    </div>

    <div class="card completed">
      <div class="card-header">
        <span class="icon">✅</span>
        <h2>Completed Orders</h2>
      </div>
      <p class="metric">70</p>
      <div class="trend-bar">
        <div class="trend-fill" style="width: 70%;"></div>
      </div>
      <p class="trend-text">70% completed</p>
    </div>

    <div class="card returns">
      <div class="card-header">
        <span class="icon">↩️</span>
        <h2>Returns</h2>
      </div>
      <p class="metric">5</p>
      <div class="trend-bar">
        <div class="trend-fill" style="width: 5%;"></div>
      </div>
      <p class="trend-text">5% returned</p>
    </div>
  </div>
</div>
