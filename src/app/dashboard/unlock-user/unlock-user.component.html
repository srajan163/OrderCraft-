<div class="container mt-4">
  <h2>🔓 Unlock User Accounts</h2>
 
  <!-- Search Bar -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="🔍 Search by email or username"
      [(ngModel)]="searchTerm"
      (input)="filterUsers()"
    />
  </div>
 
  <p *ngIf="loading">Loading locked users...</p>
  <p *ngIf="error" class="text-danger">{{ error }}</p>
 
  <table *ngIf="filteredUsers.length > 0" class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Email</th>
        <th>Username</th>
        <th>Account Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.userEmail }}</td>
        <td>{{ user.userName }}</td>
        <td>
          <span class="status-locked">Locked</span>
        </td>
        <td>
          <button
            (click)="unlock(user.userEmail)"
            class="btn btn-warning btn-sm"
          >
            Unlock
          </button>
        </td>
      </tr>
    </tbody>
  </table>
 
  <p *ngIf="!loading && filteredUsers.length === 0 && !error">
    No locked users found.
  </p>
</div>
